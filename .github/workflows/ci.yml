name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Database, lint, types, unit, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Local Supabase stack (Docker): migrations + seed, Auth, Storage and Mailpit for the e2e emails.
      - name: Start Supabase
        run: npx supabase start

      - name: Database linter and security/performance advisors
        run: npm run db:lint

      - name: pgTAP RLS suite and concurrency test
        run: npm run db:test

      - name: Generated database types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/types/database.ts || (echo "::error::src/types/database.ts is stale: run npm run db:types and commit it" && exit 1)

      - name: Point the app at the local stack
        run: node scripts/supabase-env.mjs --print >> "$GITHUB_ENV"

      # Test-only values (same as playwright.config.ts): the contact form posts to the mock Resend
      # server started by Playwright, and the e2e suite calls the revalidation webhook.
      - name: E2E service stand-ins
        run: |
          {
            echo "RESEND_API_URL=http://127.0.0.1:3999"
            echo "RESEND_API_KEY=re_e2e_test_key"
            echo "EMAIL_FROM=ACF <no-reply@acf.test>"
            echo "CONTACT_EMAIL_TO=contact@acf.test"
            echo "CONTENT_WEBHOOK_SECRET=e2e-content-webhook-secret-0123456789abcdef"
          } >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatting
        run: npm run format:check

      - name: Message files have identical keys
        run: npm run i18n:check

      - name: Unit tests (incl. token contrast)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + mobile, ar/fr/en, axe, auth journeys)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
